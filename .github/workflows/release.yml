name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and derive version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' must look like vMAJOR.MINOR.PATCH"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( minor >= 100 || patch >= 100 )); then
            echo "::error::Minor and patch must be < 100 for the versionCode scheme"
            exit 1
          fi
          if (( major >= 2147 )); then
            echo "::error::Major too large for Android versionCode"
            exit 1
          fi
          version_name="$major.$minor.$patch"
          version_code=$((major * 10000 + minor * 100 + patch))
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Releasing $version_name (versionCode $version_code)"

      - name: Ensure tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag must point to a commit on main"
            exit 1
          fi

      - name: Ensure versionCode increases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          err_file="$(mktemp)"
          trap 'rm -f "$err_file"' EXIT
          latest_tag=""
          if ! latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>"$err_file")"; then
            api_err="$(cat "$err_file")"
            if [[ "$api_err" == *"HTTP 404"* ]]; then
              echo "No existing release; skipping monotonic check."
              exit 0
            fi
            echo "::error::Failed to query latest release: $api_err"
            exit 1
          fi
          if [[ -z "$latest_tag" ]]; then
            echo "::error::Latest release query returned an empty tag"
            exit 1
          fi
          if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Latest release tag '$latest_tag' is not semver"
            exit 1
          fi
          latest_code=$((BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]))
          if (( NEW_CODE <= latest_code )); then
            echo "::error::versionCode $NEW_CODE must be greater than latest release $latest_tag ($latest_code)"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret for $name"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="Tavernite-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/${name}.apk"
          (cd dist && sha256sum "${name}.apk" > "${name}.apk.sha256")

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Tavernite ${{ steps.version.outputs.name }}" \
            --generate-notes \
            --verify-tag
